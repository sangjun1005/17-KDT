<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PNT PM 워크벤치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 앱 셸 — 상단 바 + 좌측 모듈 내비 + 본문. 홈(런처) → 모듈 표 / 프로젝트 상세(게이트 스테퍼 + 하위 탭). 폰에서는 내비가 가로 탭 */
:root {
  --bg: #EDF0F2; --panel: #FFFFFF; --sunken: #F5F7F8; --fg: #141C22; --muted: #5C6B76; --line: #D5DCE1;
  --accent: #0B6E69; --accent-fg: #FFFFFF; --accent-soft: #DCEFEC; --ink: #10262A;
  --ok: #1D7A47; --ok-soft: #DDF0E4; --warn: #9A5B00; --warn-soft: #FBEBD0; --bad: #B8322A; --bad-soft: #F9E1DE; --neu-soft: #E6EAED;
  --bar: #8FA3B1; --scrim: rgba(10, 16, 20, .45);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1316; --panel: #161D22; --sunken: #12181C; --fg: #E4EAEE; --muted: #91A0AA; --line: #28333B;
  --accent: #4FC2B9; --accent-fg: #06201E; --accent-soft: #143430; --ink: #0A1B1D;
  --ok: #5BC98A; --ok-soft: #15301F; --warn: #E7B04F; --warn-soft: #3A2B12; --bad: #F2817A; --bad-soft: #3D1E1C; --neu-soft: #222C33;
  --bar: #5C7080; --scrim: rgba(0, 0, 0, .55); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1316; --panel: #161D22; --sunken: #12181C; --fg: #E4EAEE; --muted: #91A0AA; --line: #28333B;
  --accent: #4FC2B9; --accent-fg: #06201E; --accent-soft: #143430; --ink: #0A1B1D;
  --ok: #5BC98A; --ok-soft: #15301F; --warn: #E7B04F; --warn-soft: #3A2B12; --bad: #F2817A; --bad-soft: #3D1E1C; --neu-soft: #222C33;
  --bar: #5C7080; --scrim: rgba(0, 0, 0, .55); color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { display: inline-grid; place-items: center; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ── 진입 화면 ── */
.splash { position: fixed; inset: 0; z-index: 50; background: var(--ink); color: #E6F2F1; display: grid; place-items: center; padding: 24px; transition: opacity .35s ease, visibility .35s; }
.splash.out { opacity: 0; visibility: hidden; }
.sp-box { width: min(380px, 100%); display: grid; gap: 22px; }
.sp-mark { display: flex; align-items: center; gap: 14px; }
.sp-mark .logo { width: 52px; height: 52px; border-radius: 12px; background: #13383A; border: 1px solid #22595A; display: grid; place-items: center; color: #6FD6CC; }
.sp-mark .logo svg { width: 30px; height: 30px; }
.sp-mark b { display: block; font-size: 22px; letter-spacing: -.01em; }
.sp-mark span { font-size: 13px; color: #8FB3B0; }
.sp-roll { height: 4px; background: #1B3D3F; border-radius: 2px; overflow: hidden; }
.sp-roll i { display: block; height: 100%; width: 0; background: #6FD6CC; transition: width .25s ease; }
.sp-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.sp-steps li { display: flex; justify-content: space-between; color: #7E9C9A; font-family: var(--font-mono); }
.sp-steps li.ok { color: #D5ECEA; }
.sp-steps li.ok .st::before { content: "완료"; color: #6FD6CC; }
.sp-steps li .st::before { content: "대기"; }
.sp-foot { font-size: 12px; color: #6E8D8B; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ── 상단 바 ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
.brand .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); color: #6FD6CC; display: grid; place-items: center; }
.brand .logo svg { width: 18px; height: 18px; }
.brand b { font-size: 16px; letter-spacing: -.01em; display: block; line-height: 1.2; }
.brand small { font-size: 11px; color: var(--muted); display: block; }
.pf { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.pf select { background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; max-width: 240px; color: var(--fg); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.live::before { background: var(--ok); }

.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; max-width: 1360px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; }
nav.side button { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 9px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; color: var(--muted); }
nav.side button .ico { width: 18px; height: 18px; }
nav.side button:hover { background: var(--panel); color: var(--fg); }
nav.side button[aria-current="page"] { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
nav.side button[aria-current="page"] .ico { color: var(--accent); }
nav.side .c { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
nav.side .sep { height: 1px; background: var(--line); margin: 8px 4px; }
nav.side .grp { font-size: 11px; color: var(--muted); padding: 2px 10px 4px; letter-spacing: .04em; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.side button { white-space: nowrap; flex: none; grid-template-columns: 16px auto auto; }
  nav.side button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  nav.side .sep, nav.side .grp { display: none; }
}

main { min-width: 0; display: grid; gap: 18px; align-content: start; }
.vh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
.vh h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.vh p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 7px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn .ico { width: 16px; height: 16px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.dan { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn:disabled { opacity: .5; cursor: default; }
.back { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; justify-self: start; }
.back:hover { color: var(--fg); }

.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--warn-soft); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 13px; }
.banner b { color: var(--warn); }

/* ── 홈 ── */
.hero { background: var(--ink); color: #E6F2F1; border-radius: 10px; padding: 22px 22px 20px; display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: end; justify-content: space-between; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -60px; width: 260px; height: 260px; border-radius: 50%; border: 22px solid rgba(111, 214, 204, .07); box-shadow: 0 0 0 26px rgba(111, 214, 204, .04); pointer-events: none; }
.hero .d { font-size: 12px; color: #8FB3B0; font-family: var(--font-mono); }
.hero h1 { margin: 4px 0 6px; font-size: 26px; letter-spacing: -.015em; text-wrap: balance; }
.hero p { margin: 0; color: #B9D2D0; font-size: 14px; max-width: 52ch; }
.hero p b { color: #FFFFFF; }
.hero .qa { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
.hero .qa button { border: 1px solid #2C5C5D; background: #13383A; color: #E6F2F1; border-radius: 6px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.hero .qa button:hover { background: #1A4749; }
.hero .qa .ico { width: 15px; height: 15px; color: #6FD6CC; }
.sec-t { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 -6px; }
.sec-t h2 { margin: 0; font-size: 15px; }
.sec-t span { font-size: 12px; color: var(--muted); }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.app { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; text-align: left; cursor: pointer; align-content: start; }
.app:hover { border-color: var(--accent); }
.app .ic { width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.app .ic .ico { width: 21px; height: 21px; }
.app .ic.bad { background: var(--bad-soft); color: var(--bad); }
.app b { font-size: 14px; display: block; }
.app small { font-size: 12px; color: var(--muted); display: block; margin-top: 1px; }
.app .badge { font-family: var(--font-mono); font-size: 11px; color: var(--bad); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; text-align: left; cursor: pointer; align-content: start; }
.pcard:hover { border-color: var(--accent); }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.pcard .top .mono { font-size: 11px; color: var(--muted); display: block; }
.pcard .top b { font-size: 15px; display: block; overflow-wrap: anywhere; }
.pcard .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.dots { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.dots i { height: 5px; border-radius: 2px; background: var(--neu-soft); }
.dots i.d { background: var(--accent); }
.dots i.c { background: var(--accent); opacity: .45; }
.stage-l { font-size: 12px; display: flex; justify-content: space-between; color: var(--muted); }
.stage-l b { color: var(--fg); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; text-align: left; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--font-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.bad .v { color: var(--bad); }
.kpi.warn .v { color: var(--warn); }
.kpi.static { cursor: default; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.card > header h2 { margin: 0; font-size: 14px; font-weight: 700; }
.card > header .note { font-size: 12px; color: var(--muted); }
.card .body { padding: 12px 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 18px; align-items: start; }

.pipe { display: grid; grid-template-columns: repeat(9, minmax(108px, 1fr)); gap: 6px; overflow-x: auto; padding: 12px 14px; }
.gate { display: grid; gap: 6px; align-content: start; min-width: 0; }
.gate .gh { font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--line); padding-bottom: 4px; display: flex; justify-content: space-between; gap: 4px; }
.gate .gh .no { font-family: var(--font-mono); }
.gate.has .gh { border-bottom-color: var(--accent); color: var(--fg); }
.pchip { border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px; font-size: 12px; background: var(--sunken); cursor: pointer; text-align: left; display: grid; gap: 2px; }
.pchip b { font-weight: 600; overflow-wrap: anywhere; }
.pchip .mono { font-size: 11px; color: var(--muted); }
.st-bad { border-left: 3px solid var(--bad) !important; }
.st-warn { border-left: 3px solid var(--warn) !important; }
.st-ok { border-left: 3px solid var(--ok) !important; }

.alist { list-style: none; margin: 0; padding: 0; }
.alist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.alist li:last-child { border-bottom: 0; }
.alist li:hover { background: var(--sunken); }
.alist .t { overflow-wrap: anywhere; }
.alist .t small { display: block; color: var(--muted); font-size: 12px; }
.alist .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { padding: 22px 14px; color: var(--muted); text-align: center; font-size: 13px; }

.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--neu-soft); color: var(--muted); font-weight: 500; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.prog { display: flex; align-items: center; gap: 6px; min-width: 90px; }
.prog i { flex: 1; height: 6px; background: var(--neu-soft); border-radius: 3px; overflow: hidden; position: relative; }
.prog i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); }
.prog span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; }
.over { color: var(--bad); font-weight: 600; }

/* ── 프로젝트 상세 ── */
.phead { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 16px; display: grid; gap: 16px; }
.phead .row1 { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: start; }
.phead .eb { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.phead h1 { margin: 2px 0 0; font-size: 24px; letter-spacing: -.01em; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; text-wrap: balance; }
.phead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 18px; margin: 0; }
.facts div { display: grid; gap: 2px; min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.stepper { display: grid; grid-template-columns: repeat(9, minmax(76px, 1fr)); overflow-x: auto; padding-bottom: 2px; }
.step { position: relative; display: grid; justify-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 12px; text-align: center; }
.step::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step.d::before, .step.c::before { background: var(--accent); }
.step .dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; }
.step.d .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.step.c .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.c { color: var(--fg); font-weight: 700; }
.step.d { color: var(--fg); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
.tabs .n { font-family: var(--font-mono); font-size: 11px; margin-left: 4px; color: var(--muted); }
.spec { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 14px; }
.spec.none { color: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tools input, .tools select { background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; min-width: 0; }
.tools input { flex: 1 1 200px; }
.tools .cnt { font-size: 12px; color: var(--muted); margin-left: auto; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); white-space: nowrap; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.wrap { min-width: 180px; overflow-wrap: anywhere; }
td.nw { white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunken); }
tbody tr:last-child td { border-bottom: 0; }

.gantt { overflow-x: auto; }
.gantt svg { display: block; }
.gantt text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.gantt .lbl { fill: var(--fg); font-size: 12px; font-weight: 500; }
.gantt .grid { stroke: var(--line); }
.gantt .today { stroke: var(--bad); stroke-dasharray: 3 3; }
.gantt .bar { fill: var(--bar); }
.gantt .bar.ok { fill: var(--ok); } .gantt .bar.warn { fill: var(--warn); } .gantt .bar.bad { fill: var(--bad); }
.gantt .ms { fill: var(--panel); stroke: var(--fg); stroke-width: 1.5; }
.gantt .ms.d { fill: var(--accent); stroke: var(--accent); }
.gantt .ms.late { stroke: var(--bad); fill: var(--bad-soft); }
.gantt .row { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 14px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
.tip { white-space: pre-line; position: fixed; z-index: 30; pointer-events: none; background: var(--fg); color: var(--panel); font-size: 12px; padding: 6px 9px; border-radius: 4px; max-width: 260px; }

.ov { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }

  // ───────── 표 ─────────

  // ───────── 편집 창 ─────────

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer) closeDrawer(); });

  async function save() {
    const { col, id } = drawer, s = S[col];
    const out = {};
    for (const f of s.fields) {
      const el = $("f-" + col + "-" + f.k); let v = typeof el.value === "string" ? el.value.trim() : el.value;
      if (f.t === "number") v = v === "" ? "" : Number(v);
      if (f.req && (v === "" || v == null)) { drawer.msg = "'" + f.l + "' 항목을 입력해 주세요."; renderDrawer(); $("f-" + col + "-" + f.k).focus(); return; }
      out[f.k] = v;

    const rec = id ? data[col].find(r => r.id === id) : null;
    if (rec && rec.sample) out.sample = true;
    if (!id) out.createdAt = Date.now();
    closeDrawer();
    if (local) { if (rec) Object.assign(rec, out); else data[col].push(Object.assign({ id: "l" + Date.now() }, out)); render(); toast(rec ? "저장했습니다" : "추가했습니다"); return; }
    try { if (rec) await db.collection(col).doc(id).update(out); else await db.collection(col).add(out); toast(rec ? "저장했습니다" : "추가했습니다"); }
    catch (e) { fail(e); }
  }
  async function del(col, id) {
    closeDrawer();
    if (col === "projects" && curProj === id && view === "project") view = "projects";
    if (local) { data[col] = data[col].filter(r => r.id !== id); render(); toast("삭제했습니다"); return; }
    try { await db.collection(col).doc(id).delete(); toast("삭제했습니다"); } catch (e) { fail(e); }
  }
  let clearing = false;

    clearing = true;
    try { for (const c of COLS) for (const r of data[c].filter(r => r.sample)) await db.collection(c).doc(r.id).delete(); toast("예시 데이터를 지웠습니다"); }

  })();
})();
