{% extends "base.html" %} {% block contents %}
<div
  class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-indigo-100 px-4 py-16"
>
  <div
    class="mx-auto flex max-w-5xl flex-col items-center justify-center rounded-3xl border border-slate-200 bg-white/90 p-10 text-center shadow-xl shadow-slate-200/70 backdrop-blur sm:p-16"
  >
    <p
      class="mb-4 inline-flex rounded-full bg-sky-100 px-3 py-1 text-sm font-medium text-sky-700"
    >
      ✨ 오늘도 생산적인 하루
    </p>
    <h1
      class="text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl"
    >
      환영합니다. 투두리스트
    </h1>
    <p class="mt-4 max-w-2xl text-lg leading-8 text-slate-600">
      메모를 작성하고, 할 일을 정리하고, 계획을 한눈에 관리해보세요.
    </p>
    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <a
        href="/write"
        class="rounded-lg bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
      >
        메모 작성하기
      </a>
      <a
        href="/memos"
        class="rounded-lg border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
      >
        메모 보기
      </a>
    </div>
  </div>
</div>
{% endblock %}
