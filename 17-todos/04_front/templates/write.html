{% extends "base.html" %}
<!--  -->
{% block contents %}
<div
  class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-indigo-100 px-4 py-10"
>
  <div
    class="mx-auto max-w-3xl rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70"
  >
    <div class="mb-8">
      <p
        class="mb-2 inline-flex rounded-full bg-sky-100 px-3 py-1 text-sm font-medium text-sky-700"
      >
        새 메모 작성
      </p>
      <h1 class="text-2xl font-semibold text-slate-900">
        오늘의 생각을 기록해보세요
      </h1>
      <p class="mt-2 text-sm text-slate-500">
        제목과 내용을 입력한 뒤 저장하면 메모 목록에 바로 반영됩니다.
      </p>
    </div>

    <form id="memo-form" class="space-y-5">
      <div>
        <label for="title" class="mb-1 block text-sm font-medium text-slate-700"
          >제목</label
        >
        <input
          id="title"
          name="title"
          type="text"
          placeholder="메모 제목을 입력하세요"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </div>

      <div>
        <label
          for="content"
          class="mb-1 block text-sm font-medium text-slate-700"
          >내용</label
        >
        <textarea
          id="content"
          name="content"
          rows="8"
          placeholder="메모 내용을 입력하세요"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3">
        <a
          href="/memos"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
        >
          취소
        </a>
        <button
          type="submit"
          class="rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
        >
          저장하기
        </button>
      </div>
    </form>

    <script>
      document
        .getElementById("memo-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const payload = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
          };

          const response = await fetch("/memos", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (response.status >= 200 && response.status < 300) {
            window.location.href = "/memos";
          } else {
            const errorText = await response.text();
            alert(
              `메모 저장에 실패했습니다. (${response.status})\n${errorText}`,
            );
          }
        });
    </script>
  </div>
</div>
{% endblock %}
