{% extends "base.html" %} {% block contents %}
<div
  class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-indigo-100 px-4 py-12 flex items-center justify-center"
>
  <div
    class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70"
  >
    <div class="mb-8 text-center">
      <p
        class="mb-2 inline-flex rounded-full bg-sky-100 px-3 py-1 text-sm font-medium text-sky-700"
      >
        ✨ 새 계정 만들기
      </p>
      <h1 class="text-2xl font-semibold text-slate-900">회원가입</h1>
      <p class="mt-2 text-sm text-slate-500">
        투두리스트를 시작하려면 정보를 입력해주세요.
      </p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label
          for="username"
          class="mb-1 block text-sm font-medium text-slate-700"
          >닉네임</label
        >
        <input
          id="username"
          name="username"
          type="text"
          placeholder="사용할 닉네임을 입력하세요"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </div>

      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-700"
          >이메일</label
        >
        <input
          id="email"
          name="email"
          type="email"
          placeholder="example@email.com"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </div>

      <div>
        <label
          for="password"
          class="mb-1 block text-sm font-medium text-slate-700"
          >비밀번호</label
        >
        <input
          id="password"
          name="password"
          type="password"
          placeholder="영문, 숫자 포함 8자 이상"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </div>

      <div>
        <label
          for="confirm-password"
          class="mb-1 block text-sm font-medium text-slate-700"
          >비밀번호 확인</label
        >
        <input
          id="confirm-password"
          name="confirm_password"
          type="password"
          placeholder="비밀번호를 다시 입력하세요"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </div>

      <div
        class="flex items-start gap-2 rounded-lg bg-slate-50 px-3 py-3 text-sm text-slate-600"
      >
        <input
          id="terms"
          type="checkbox"
          class="mt-0.5 h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500"
          required
        />
        <label for="terms">이용약관에 동의합니다.</label>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
      >
        계정 만들기
      </button>
    </form>

    <script>
      document
        .getElementById("signup-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm-password").value;

          if (password !== confirmPassword) {
            alert("비밀번호가 일치하지 않습니다.");
            return;
          }

          const payload = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: password,
          };

          const response = await fetch("/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (response.status >= 200 && response.status < 300) {
            window.location.href = "/login";
          } else {
            const errorText = await response.text();
            alert(
              `회원가입에 실패했습니다. (${response.status})\n${errorText}`,
            );
          }
        });
    </script>

    <p class="mt-6 text-center text-sm text-slate-500">
      이미 계정이 있으신가요?
      <a href="#" class="font-medium text-sky-600 hover:text-sky-700">로그인</a>
    </p>
  </div>
</div>
{% endblock %}
